<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques Skaneo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="page">
        <div class="brand">
            <div class="brand-dot"></div>
            <span>Skaneo</span>
        </div>

        <div class="card">
            <p class="eyebrow">Tableau de bord</p>
            <h1>Statistiques</h1>

            <div class="stats-grid">
                <div class="stat-block">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3V16M12 16L7 11M12 16L17 11M5 21H19" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <h2 id="downloads" class="stat">
                        <span class="skeleton"></span>
                    </h2>
                    <p class="stat-label">Téléchargements</p>
                </div>

                <div class="stat-divider"></div>

                <div class="stat-block">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 12C2 12 5 5 12 5C19 5 22 12 22 12C22 12 19 19 12 19C5 19 2 12 2 12Z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </div>
                    <h2 id="visits" class="stat">
                        <span class="skeleton"></span>
                    </h2>
                    <p class="stat-label">Visites du site</p>
                </div>
            </div>

            <button onclick="loadStats()" id="refreshBtn">
                <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M4 4V9H4.582M20 20V15H19.418M19.418 15C18.9721 16.1128 18.2039 17.0777 17.2039 17.7818C16.2038 18.4858 15.0166 18.8988 13.7847 18.9718C12.5528 19.0448 11.3251 18.7749 10.2451 18.1935C9.16515 17.6121 8.27544 16.7418 7.68 15.681M4.582 9C5.02786 7.88718 5.79614 6.92231 6.79619 6.21823C7.79624 5.51415 8.98338 5.10118 10.2153 5.02818C11.4472 4.95517 12.6749 5.22512 13.7549 5.80652C14.8349 6.38793 15.7246 7.25817 16.32 8.319"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Actualiser
            </button>

            <p class="updated" id="lastUpdated"></p>
        </div>

        <p class="footer">© 2026 Skaneo · Admin</p>
    </div>

    <script src="admin.js"></script>

</body>

</html>
